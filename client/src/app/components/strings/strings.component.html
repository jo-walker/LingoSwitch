<div *ngIf="strings && strings.length > 0; else noStrings">
  <table>
    <thead>
      <tr>
        <th>English</th>
        <th>French</th>
        <th>German</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let string of strings">
        <td>{{ string.eng_us }}</td>
        <td>{{ string.fr }}</td>
        <td>{{ string.de }}</td>
        <td>
          <button [routerLink]="['/strings/edit', string.id]">Edit</button>
          <button (click)="deleteString(string.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<ng-template #noStrings>
  <p>No strings found.</p>
</ng-template>
