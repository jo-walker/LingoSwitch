<div class="string-list-container">
  <button pButton label="Add String" class="p-button-info" routerLink="/strings/new"></button>

  <div class="datatable-container">
    <p-table 
      [value]="rows" 
      [paginator]="true" 
      [rows]="10" 
      [rowsPerPageOptions]="[10, 20, 50]" 
      [lazy]="true" 
      [totalRecords]="totalRecords"
      [loading]="loading"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="eng_us">English <p-sortIcon field="eng_us"></p-sortIcon></th>
          <th pSortableColumn="fr">French <p-sortIcon field="fr"></p-sortIcon></th>
          <th pSortableColumn="de">German <p-sortIcon field="de"></p-sortIcon></th>
          <th pSortableColumn="mn">Mongolian <p-sortIcon field="mn"></p-sortIcon></th>
          <th pSortableColumn="context">Context <p-sortIcon field="context"></p-sortIcon></th>
          <th>Status</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-rowData>
        <tr>
          <td>{{ rowData.eng_us }}</td>
          <td>{{ rowData.fr }}</td>
          <td>{{ rowData.de }}</td>
          <td>{{ rowData.context }}</td>
          <td>{{ rowData.active ? 'Active' : 'Inactive' }}</td>
          <td>
            <button pButton type="button" 
                    [label]="rowData.active ? 'Deactivate' : 'Activate'" 
                    (click)="toggleStatus(rowData)">
            </button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6">No strings found.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
